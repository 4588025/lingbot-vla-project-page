        <p class="eyebrow">01 / DATA PIPELINE</p>
        <h1 data-zh="先修复轨迹，再训练策略。" data-en="Repair trajectories before training policies.">先修复轨迹，再训练策略。</h1>
        <p data-zh="遥操作数据不是天然干净的。系统按时间顺序检查动作连续性，定位停滞、跳变和非法片段，避免无效动作污染 Flow Matching 目标。" data-en="Teleoperation data is not clean by default. The system checks temporal action continuity to locate stalls, jumps, and illegal segments before they corrupt Flow Matching targets.">遥操作数据不是天然干净的。系统按时间顺序检查动作连续性，定位停滞、跳变和非法片段，避免无效动作污染 Flow Matching 目标。</p>
      </div>
    </section>
    <section class="section shell">
      <div class="split-feature">
        <article class="feature-copy">
          <span class="chip">SO-ARM101 LEADER / FOLLOWER</span>
          <h2 data-zh="专家示范采集" data-en="Expert demonstration capture">专家示范采集</h2>
          <p data-zh="操作员通过 Leader Arm 遥操作 Follower Arm，记录观测、关节动作与任务上下文，形成长时序专家轨迹。" data-en="An operator teleoperates the Follower Arm through the Leader Arm while observations, joint actions, and task context are recorded into long-horizon expert trajectories.">操作员通过 Leader Arm 遥操作 Follower Arm，记录观测、关节动作与任务上下文，形成长时序专家轨迹。</p>
        </article>
