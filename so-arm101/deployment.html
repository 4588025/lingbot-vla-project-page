<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deployment · π₀ × SO-ARM101</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="deployment"><div data-header></div><main><section class="page-hero"><div class="shell"><p class="eyebrow">03 / DEPLOYMENT</p><h1 data-zh="减少等待，平滑动作块切换。" data-en="Wait less. Switch chunks smoothly.">减少等待，平滑动作块切换。</h1><p data-zh="Receding Horizon 让下一次请求在当前动作块完全结束前就开始，BLEND_STEPS 则通过线性插值减轻相邻动作块预测差异造成的突变。" data-en="Receding Horizon starts the next request before the current action chunk fully ends, while BLEND_STEPS linearly interpolates chunk transitions to reduce discontinuities between predictions.">Receding Horizon 让下一次请求在当前动作块完全结束前就开始，BLEND_STEPS 则通过线性插值减轻相邻动作块预测差异造成的突变。</p></div></section><section class="section shell"><div class="split-feature"><article class="feature-copy"><span class="chip">RECEDING HORIZON</span><h2 data-zh="请求延迟降低 6×" data-en="6× lower request latency">请求延迟降低 6×</h2><p data-zh="将动作执行与下一次云端推理解耦，使请求延迟从 1200ms 降至 200ms，降低长时序控制中的等待累积。" data-en="Decoupling action execution from the next cloud inference request reduces request latency from 1200ms to 200ms and limits accumulated waiting in long-horizon control.">将动作执行与下一次云端推理解耦，使请求延迟从 1200ms 降至 200ms，降低长时序控制中的等待累积。</p></article><article class="feature-visual"><span class="chip">LATENCY</span><div class="latency-chart"><div class="latency-row"><span data-zh="同步执行" data-en="Synchronous">同步执行</span><i style="--width:100%"></i><b>1200ms</b></div><div class="latency-row good"><span>Receding</span><i style="--width:16.7%"></i><b>200ms</b></div></div><p class="evidence-note" data-zh="BLEND_STEPS 在动作块交界处做线性插值，避免突然跳变。" data-en="BLEND_STEPS applies linear interpolation at action-chunk boundaries to avoid abrupt jumps.">BLEND_STEPS 在动作块交界处做线性插值，避免突然跳变。</p></article></div></section><section class="next-page shell"><div><span data-zh="下一页" data-en="Next">下一页</span><strong da
